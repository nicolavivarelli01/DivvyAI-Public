version: 2

unit_tests:
  - name: status_counts_and_filters
    model: stg_station_status
    given:
      - input: source('divvy', 'station_records')
        format: sql
        rows: |
          SELECT
              'fixture-capture' AS capture_id,
              'raw/fixture.zip' AS archive_object_name,
              fixture.feed_name,
              'https://example.test/feed' AS source_url,
              TIMESTAMP '2026-10-09 14:00:00+00' AS received_at,
              fixture.station_id,
              JSON '{}' AS feed_metadata,
              fixture.payload,
              CASE
                  WHEN fixture.station_id = '004'
                      THEN DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
                  ELSE CURRENT_DATE()
              END AS _PARTITIONDATE
          FROM (
              SELECT
                  '001' AS station_id,
                  'station_status' AS feed_name,
                  JSON '{"num_bikes_available": 3, "num_docks_available": 7}' AS payload
              UNION ALL
              SELECT '002', 'station_status', JSON '{"num_bikes_available": "invalid"}'
              UNION ALL
              SELECT '003', 'station_information',
                  JSON '{"num_bikes_available": 99, "num_docks_available": 99}'
              UNION ALL
              SELECT '004', 'station_status',
                  JSON '{"num_bikes_available": 9, "num_docks_available": 1}'
          ) AS fixture
    expect:
      format: sql
      rows: |
        SELECT
            'fixture-capture' AS capture_id,
            '001' AS station_id,
            TIMESTAMP '2026-10-09 14:00:00+00' AS received_at,
            3 AS bikes_available,
            7 AS docks_available
        UNION ALL
        SELECT
            'fixture-capture', '002',
            TIMESTAMP '2026-10-09 14:00:00+00',
            CAST(NULL AS INT64), CAST(NULL AS INT64)